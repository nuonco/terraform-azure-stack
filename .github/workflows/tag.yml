name: tag-and-release

on:
  push:
    branches:
      - main

# Prevent overlapping releases if two merges land close together.
concurrency:
  group: tag-and-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Gate the tag on the same checks PRs run. A bad tag can't be recalled once
  # the Terraform Registry has ingested it — it can only be superseded.
  validate:
    uses: ./.github/workflows/validate.yml

  tag:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags are required to compute the next version.
          fetch-depth: 0

      - name: Compute and push next version tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Bump from conventional-commit messages since the last tag:
          #   feat:             -> minor
          #   fix:/others       -> patch
          #   feat!: / BREAKING -> major
          default_bump: patch
          tag_prefix: v

      # Modules ship no build artifacts — the Terraform Registry reads the tag
      # and the repo tree directly, so there is nothing to upload. The release
      # exists for the changelog.
      - name: Create GitHub release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Summary
        if: steps.tag.outputs.new_tag != ''
        run: |
          {
            echo "Tagged **${{ steps.tag.outputs.new_tag }}**"
            echo ""
            echo "The Terraform Registry ingests new tags via webhook, usually within a few minutes."
          } >> "$GITHUB_STEP_SUMMARY"
